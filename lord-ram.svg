  <title id="title">Lord Rama Vector Illustration</title>
  <desc id="desc">Traditional Lord Rama poster-style vector illustration with crown, halo, bow, arrow, saffron attire, and devotional background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5a0f1e"/>
      <stop offset="50%" stop-color="#7f163d"/>
      <stop offset="100%" stop-color="#2a1034"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f7d783" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f7d783" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0%" stop-color="#eec49c"/>
      <stop offset="50%" stop-color="#f2d6a5"/>
      <stop offset="100%" stop-color="#c78a54"/>
    </linearGradient>
    <linearGradient id="saffron" x1="0" x2="1">
      <stop offset="0%" stop-color="#f6c25b"/>
      <stop offset="50%" stop-color="#e89b2f"/>
      <stop offset="100%" stop-color="#c26d18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffe99c"/>
      <stop offset="50%" stop-color="#f3c85c"/>
      <stop offset="100%" stop-color="#b97718"/>
    </linearGradient>
    <linearGradient id="dhoti" x1="0" x2="1">
      <stop offset="0%" stop-color="#d7482f"/>
      <stop offset="50%" stop-color="#9c1f28"/>
      <stop offset="100%" stop-color="#6d1320"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1a0f12" flood-opacity="0.35"/>
    </filter>
  </defs>

